    if (!bySize[l.size]) bySize[l.size] = {};
    var key = fmtPrice(l.price);
    if (!bySize[l.size][key]) bySize[l.size][key] = { price: l.price, count: 0, gap: 0 };
    bySize[l.size][key].count += 1;
    if (l.gap) bySize[l.size][key].gap += 1;
  });
  var sizes = Object.keys(bySize).map(Number).sort(function(a,b){ return b - a; });
  return sizes.map(function(size) {
    var rows = Object.keys(bySize[size]).map(function(k){ return bySize[size][k]; });
    rows.sort(function(a,b){ return b.price - a.price; });
    return { size: size, rows: rows };
  });
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function sparkline(values, color, w, h) {
  var clean = values.map(function(v){ return v === null || v === undefined ? null : v; });
  var nums = clean.filter(function(v){ return v !== null; });
  if (nums.length < 2) return '<span style="font-size:10px;color:#d6d3d1;">데이터 부족</span>';
  var min = Math.min.apply(null, nums);
  var max = Math.max.apply(null, nums);
  var range = (max - min) || 1;
  var step = w / (clean.length - 1);
  var pts = [];
  var circles = '';
  clean.forEach(function(v, i) {
    if (v === null) return;
    var x = i * step;
    var y = h - ((v - min) / range) * (h - 6) - 3;
    pts.push(x.toFixed(1) + ',' + y.toFixed(1));
    circles += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2.4" fill="' + color + '" />';
  });
  return (
    '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
      '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />' +
      circles +
    '</svg>'
  );
}

function renderDetail(name, listings, color, gapOnly) {
  var stat = summarize(listings);
  var grouped = groupByPriceAndSize(listings);
  var maxCount = 1;
  grouped.forEach(function(g){ g.rows.forEach(function(r){ if (r.count > maxCount) maxCount = r.count; }); });

  var gapInfo = stat.gap > 0
    ? '<span class="gapinfo">· 갭투자 ' + stat.gap + '건 (' + stat.gapPct + '%)</span>'
    : '';

  var blocks = grouped.map(function(g) {
    var totalInSize = g.rows.reduce(function(a,r){ return a + r.count; }, 0);
    var rowsHtml = g.rows.map(function(r) {
      if (gapOnly && r.gap === 0) return '';
      var barPct = (r.count / maxCount) * 100;
      var gapPct = (r.gap / maxCount) * 100;
      var gapFill = r.gap > 0 ? '<div class="price-bar-fill" style="width:' + gapPct + '%;background:' + GAP_COLOR + '"></div>' : '';
      var gapTag = r.gap > 0 ? ' <span class="gaptag">(갭' + r.gap + ')</span>' : '';

          '<div class="price-label">' + fmtPrice(r.price) + '억</div>' +
          '<div class="price-bar-track">' +
            '<div class="price-bar-fill" style="width:' + barPct + '%;background:' + color + ';opacity:.3"></div>' +
            gapFill +
          '</div>' +
          '<div class="price-count">' + r.count + '건' + gapTag + '</div>' +
        '</div>'
      );
    }).join('');
    return (
      '<div class="size-block">' +
        '<div class="size-head"><span class="size-badge">' + g.size + '㎡</span><span class="size-count">' + totalInSize + '건</span></div>' +
        rowsHtml +

  return (
    '<div class="detail">' +

        '</div>' +

function renderSizeTrendRow(size, series, color) {
  var counts = series.map(function(s){ return s.n; });
  var avgs = series.map(function(s){ return s.avg; });
  var dates = series.map(function(s){ return s.date; });
  var firstN = counts[0], lastN = counts[counts.length-1];
  var validAvgs = avgs.filter(function(v){ return v !== null; });
  var firstAvg = validAvgs.length ? validAvgs[0] : null;
  var lastAvg = validAvgs.length ? validAvgs[validAvgs.length-1] : null;

  var nDelta = lastN - firstN;
  var nDeltaClass = nDelta > 0 ? 'up' : (nDelta < 0 ? 'down' : 'flat');
  var nDeltaText = (nDelta > 0 ? '+' : '') + nDelta + '건';

  var avgDeltaHtml = '';
  if (firstAvg !== null && lastAvg !== null) {
    var avgDelta = Math.round((lastAvg - firstAvg) * 100) / 100;
    var avgDeltaClass = avgDelta > 0 ? 'up' : (avgDelta < 0 ? 'down' : 'flat');
    var avgDeltaText = (avgDelta > 0 ? '+' : '') + avgDelta + '억';
    avgDeltaHtml = '<span class="trend-delta ' + avgDeltaClass + '">평균가 ' + avgDeltaText + '</span>';
  }

  return (
    '<div class="size-trend-row">' +
      '<div class="size-trend-top">' +
        '<span class="size-trend-label">' + size + '㎡</span>' +
        '<div style="display:flex;gap:6px;">' +
          '<span class="trend-delta ' + nDeltaClass + '">매물 ' + nDeltaText + '</span>' +
          avgDeltaHtml +
        '</div>' +
      '</div>' +
      '<div class="trend-body">' +
        '<div>' +
          '<div class="trend-block-label">매물 수</div>' +
          '<div class="trend-block-value">' + firstN + '건 → ' + lastN + '건</div>' +
          '<div class="spark-wrap">' + sparkline(counts, color, 150, 34) + '</div>' +
          '<div class="spark-dates" style="width:150px;">' + dates.map(function(d){return '<span>'+d+'</span>';}).join('') + '</div>' +
        '</div>' +
        '<div>' +
          '<div class="trend-block-label">평균가</div>' +
          '<div class="trend-block-value">' + (firstAvg !== null ? firstAvg.toFixed(2)+'억' : '-') + ' → ' + (lastAvg !== null ? lastAvg.toFixed(2)+'억' : '-') + '</div>' +
          '<div class="spark-wrap">' + sparkline(avgs, GAP_COLOR, 150, 34) + '</div>' +
          '<div class="spark-dates" style="width:150px;">' + dates.map(function(d){return '<span>'+d+'</span>';}).join('') + '</div>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

  if (diff.gone.length > 0) {

    diff.gone.forEach(function(it) {

  if (diff.price_changes.length > 0) {

    diff.price_changes.forEach(function(it) {

      body +

  );
}

function groupTxBySize(txList) {
  var withFloor = txList.map(function(t) {
    return { tx: t, f: Math.floor(t.size) };
  });
  var uniqueFloors = Array.from(new Set(withFloor.map(function(x){ return x.f; }))).sort(function(a,b){ return a-b; });

  // cluster adjacent integer sizes (difference <= 1) into one group, e.g. 72,73 -> one group; 84,85 -> one group
  var clusters = [];
  uniqueFloors.forEach(function(f) {
    if (clusters.length && f - clusters[clusters.length-1][clusters[clusters.length-1].length-1] <= 1) {
      clusters[clusters.length-1].push(f);
    } else {
      clusters.push([f]);
    }
  });

  var floorToClusterIdx = {};
  clusters.forEach(function(cluster, idx) {
    cluster.forEach(function(f) { floorToClusterIdx[f] = idx; });
  });

  var groupsMap = {};
  withFloor.forEach(function(x) {
    var idx = floorToClusterIdx[x.f];
    if (!groupsMap[idx]) groupsMap[idx] = [];
    groupsMap[idx].push(x.tx);
  });

  var groups = Object.keys(groupsMap).map(function(idx) {
    var cluster = clusters[idx];
    var minF = cluster[0], maxF = cluster[cluster.length-1];
    var label = (minF === maxF) ? String(minF) : (minF + '~' + maxF);
    var list = groupsMap[idx].slice().sort(function(a,b){ return a.date > b.date ? -1 : 1; });
    var maxAmount = Math.max.apply(null, list.map(function(t){ return t.amount; }));
    var maxTxs = list.filter(function(t){ return t.amount === maxAmount; });
    return { size: label, sortKey: maxF, list: list, maxAmount: maxAmount, maxTxs: maxTxs };
  });

  groups.sort(function(a,b){ return b.sortKey - a.sortKey; });
  return groups;
}


function formatDelta(d) {
  if (d === null || d === undefined) return '';
  if (d === 0) return '<span class="tx-delta-up">± 0.00억</span>';
  var cls = d > 0 ? 'tx-delta-up' : 'tx-delta-down';
  var sign = d > 0 ? '+' : '';
  return '<span class="' + cls + '">' + sign + d.toFixed(2) + '억</span>';
}

    } else {
      bodyHtml += '<div class="grid">' + sortedComplexes.map(function(name) {
        return renderCard(name, regionData[name], COLORS[name] || '#8172B2');
      }).join('') + '</div>';
    }
  } else if (state.tab === 'trend') {
    var regionTrend = regionTrendAll;
    var trendNames = Object.keys(regionTrend).sort(function(a,b){
      return (regionData[b] ? regionData[b].length : 0) - (regionData[a] ? regionData[a].length : 0);
    });
    var firstComplex = trendNames[0];
    var firstSizeKey = Object.keys(regionTrend[firstComplex])[0];
    var sampleSeries = regionTrend[firstComplex][firstSizeKey];
    var firstDate = sampleSeries[0].date;
    var lastDate = sampleSeries[sampleSeries.length-1].date;
    bodyHtml += '<div class="toolbar"><div class="toolbar-title">' + firstDate + ' → ' + lastDate + ' 평형별 변화</div></div>';
    bodyHtml += trendNames.map(function(name) {
      return renderTrendCard(name, regionTrend[name], COLORS[name] || '#8172B2');
    }).join('');
  } else if (state.tab === 'changes') {
    var regionChange = regionChangeAll;
    var cdates2 = changeDatesAll;
    var changeNames = Object.keys(regionChange).sort(function(a,b){ return regionChange[b].after_count - regionChange[a].after_count; });

    var totB=0, totA=0, totNew=0, totGone=0, totPc=0;
    changeNames.forEach(function(n) {
      var d = regionChange[n];
      totB += d.before_count; totA += d.after_count; totNew += d.new.length; totGone += d.gone.length; totPc += d.price_changes.length;
    });
    var totDelta = totA - totB;

    bodyHtml += '<div class="toolbar"><div class="toolbar-title">조사기간 : ' + cdates2.before + ' → ' + cdates2.after + '</div></div>';

    bodyHtml += '<div class="stats four">' +
      '<div class="stat-card"><div class="stat-label">총 매물</div><div class="stat-value">' + totB + ' → ' + totA + '<small>건</small></div></div>' +
      '<div class="stat-card"><div class="stat-label">신규</div><div class="stat-value new">' + totNew + '<small>건</small></div></div>' +
      '<div class="stat-card"><div class="stat-label">소멸</div><div class="stat-value gone">' + totGone + '<small>건</small></div></div>' +
      '<div class="stat-card"><div class="stat-label">가격변동</div><div class="stat-value changed">' + totPc + '<small>건</small></div></div>' +
    '</div>';

    var tableRows = changeNames.map(function(n) {
      var d = regionChange[n];
      var delta = d.after_count - d.before_count;
      var deltaClass = delta > 0 ? 'delta-up' : (delta < 0 ? 'delta-down' : 'delta-flat');
      var deltaText = delta > 0 ? ('▲' + delta) : (delta < 0 ? ('▼' + Math.abs(delta)) : '-');
      return (
        '<tr>' +
          '<td class="name">' + esc(n) + '</td>' +
          '<td>' + d.before_count + '</td>' +
          '<td>' + d.after_count + '</td>' +
          '<td class="' + deltaClass + '">' + deltaText + '</td>' +
          '<td>' + d.new.length + '</td>' +
          '<td>' + d.gone.length + '</td>' +
          '<td>' + d.price_changes.length + '</td>' +
        '</tr>'
      );
    }).join('');

    var totDeltaClass = totDelta > 0 ? 'delta-up' : (totDelta < 0 ? 'delta-down' : 'delta-flat');
    var totDeltaText = totDelta > 0 ? ('▲' + totDelta) : (totDelta < 0 ? ('▼' + Math.abs(totDelta)) : '-');

    bodyHtml += '<div class="change-table-wrap"><table class="change-table">' +
      '<thead><tr><th>단지</th><th>' + cdates2.before + '</th><th>' + cdates2.after + '</th><th>증감</th><th>신규</th><th>소멸</th><th>가격변동</th></tr></thead>' +
      '<tbody>' + tableRows +
      '<tr class="total"><td class="name">합계</td><td>' + totB + '</td><td>' + totA + '</td><td class="' + totDeltaClass + '">' + totDeltaText + '</td><td>' + totNew + '</td><td>' + totGone + '</td><td>' + totPc + '</td></tr>' +
      '</tbody></table></div>';

    bodyHtml += changeNames.map(function(name) {
      return renderChangeCard(name, regionChange[name], COLORS[name] || '#8172B2');
    }).join('');
  } else if (state.tab === 'persistgone') {
    var goneList = (isApt ? PERSIST_GONE.apt : PERSIST_GONE.oft) || [];
    bodyHtml += '<div class="toolbar"><div class="toolbar-title">한 번 사라진 뒤 지금까지 다시 올라오지 않은 매물 (' + PERSIST_GONE_RANGE.from + ' ~ ' + PERSIST_GONE_RANGE.to + ' 조사분)</div></div>';
    if (goneList.length === 0) {
      bodyHtml += '<div class="empty-state">지속소멸 매물이 없습니다.</div>';
    } else {
      var goneByComplex = {};
      goneList.forEach(function(g) {
        (goneByComplex[g.complex] = goneByComplex[g.complex] || []).push(g);
      });
      bodyHtml += '<div class="stats"><div class="stat-card"><div class="stat-label">지속소멸 매물</div><div class="stat-value gone">' + goneList.length + '<small>건</small></div></div></div>';
      bodyHtml += Object.keys(goneByComplex).sort(function(a,b){ return goneByComplex[b].length - goneByComplex[a].length; }).map(function(name) {
        var color = COLORS[name] || '#8172B2';
        var rows = goneByComplex[name].map(function(g) {
          return (
            '<tr>' +
              '<td>' + esc(g.dong) + '</td>' +
              '<td>' + esc(g.floor) + '층</td>' +
              '<td>' + esc(g.type || '-') + '</td>' +
              '<td>' + g.size + '㎡</td>' +
              '<td>' + esc(g.dir || '-') + '</td>' +
              '<td>' + g.price.toFixed(2) + '억' + (g.gap ? '<span class="gap-tag">갭</span>' : '') + '</td>' +
              '<td>~' + esc(g.date) + '</td>' +
            '</tr>'
          );
        }).join('');
        return (
          '<div class="change-card" style="border-top-color:' + color + '">' +
            '<div class="change-card-title">' + esc(name) + ' <small>(' + goneByComplex[name].length + '건)</small></div>' +
            '<table class="change-table persistgone-table"><thead><tr><th>동</th><th>층</th><th>타입</th><th>면적</th><th>향</th><th>가격</th><th>마지막 확인</th></tr></thead>' +
            '<tbody>' + rows + '</tbody></table>' +
          '</div>'
        );
      }).join('');
    }
  } else {
    var txNames = Object.keys(regionData).sort(function(a,b){
      return (realTxAll[b] ? realTxAll[b].length : 0) - (realTxAll[a] ? realTxAll[a].length : 0);
    });
    if (!state.txComplex) {
      bodyHtml += '<div class="toolbar"><div class="toolbar-title">국토교통부 실거래가 공개시스템 기준</div></div>';
      bodyHtml += '<div class="grid">' + txNames.map(function(name) {
        return renderTxComplexCard(name, realTxAll[name], COLORS[name] || '#8172B2');
      }).join('') + '</div>';
    } else if (!state.txSize) {
      bodyHtml += renderTxSizeList(state.txComplex, realTxAll[state.txComplex] || [], COLORS[state.txComplex] || '#8172B2');
    } else {
      bodyHtml += renderTxDetail(state.txComplex, state.txSize, realTxAll[state.txComplex] || [], COLORS[state.txComplex] || '#8172B2');
    }
  }

  document.getElementById('app').innerHTML =
    '<div class="top-row">' +
      '<div style="flex:1;min-width:0;">' +
        '<div class="eyebrow"><span>\ud83c\udfe0</span> 부자아저씨 가난한아빠 매물 대시보드</div>' +
        '<div class="category-toggle">' +
          '<button class="' + (isApt ? 'active' : '') + '" data-category="apt">\ud83c\udfe0 \uc544\ud30c\ud2b8</button>' +
          '<button class="' + (!isApt ? 'active' : '') + '" data-category="oft">\ud83c\udfe2 \uc624\ud53c\uc2a4\ud154</button>' +
        '</div>' +
        '<div class="headrow">' +
          '<div><h1>' + esc(regionLabel) + ' 매물현황</h1>' +
          '<p class="sub">조사일 ' + regionDate + ' · ' + complexNames.length + '개 단지 · 대표매물 ' + totalStat.n + '건</p></div>' +
        '</div>' +
      '</div>' +
      '<div class="header-photo"><img src="' + CHARACTER_IMG + '" alt="부자아저씨 가난한아빠" /></div>' +
    '</div>' +
    CONTACT_HTML +
    tabbarHtml +
    bodyHtml +
    '<div id="visitorCounter" class="visitor-counter">방문자 수 불러오는 중...</div>' +
    '<div class="footer-note">갭투자물건은 대표 매물뿐 아니라 같은 매물을 올린 중복 부동산들의 특징 문구까지 모두 확인해서, 세안고 · 전세안고 · 갭투자 · 긴잔금 · 무주택 · 긴전세 · 임차인 · 명도불가 · 입주불가 등 사실상 즉시입주가 어려운 표현이 하나라도 있으면 갭투자로 집계했습니다.<br/>매물 변동은 동 · 층 · 타입을 기준으로 매칭했으며, 평형별 추이는 조사일별 스냅샷 집계입니다.</div>';

  document.querySelectorAll('[data-category]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      state.category = btn.getAttribute('data-category');
      state.selected = null;
      state.txComplex = null;
      state.txSize = null;
      state.gapOnly = false;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
  document.querySelectorAll('[data-tab]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      state.tab = btn.getAttribute('data-tab');
      state.selected = null;
      state.txComplex = null;
      state.txSize = null;
      render();
    });
  });
  document.querySelectorAll('[data-complex]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      state.selected = btn.getAttribute('data-complex');
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
  document.querySelectorAll('[data-txcomplex]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      state.txComplex = btn.getAttribute('data-txcomplex');
      state.txSize = null;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
  document.querySelectorAll('[data-txsize]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      state.txSize = btn.getAttribute('data-txsize');
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
  var txBackBtn = document.getElementById('txBackBtn');
  if (txBackBtn) txBackBtn.addEventListener('click', function() {
    state.txComplex = null;
    state.txSize = null;
    render();
  });
  var txSizeBackBtn = document.getElementById('txSizeBackBtn');
  if (txSizeBackBtn) txSizeBackBtn.addEventListener('click', function() {
    state.txSize = null;
    render();
  });
  var backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.addEventListener('click', function() {
    state.selected = null;
    render();
  });
  var gapBtn = document.getElementById('gapToggleBtn');
  if (gapBtn) gapBtn.addEventListener('click', function() {
    state.gapOnly = !state.gapOnly;
    render();
  });
}

// --- visitor counter (countapi.mileshilliard.com, free/no-signup) ---
(function() {
  var base = 'https://countapi.mileshilliard.com/api/v1/hit/';
  var today = new Date().toISOString().slice(0, 10);
  var totalKey = 'richfather_giheung_dashboard_total';
  var todayKey = 'richfather_giheung_dashboard_' + today;
  var totalCount = null, todayCount = null;
  function updateCounterDisplay() {
    var el = document.getElementById('visitorCounter');
    if (!el) return;
    if (totalCount === null || todayCount === null) return;
    el.innerHTML = '오늘 방문 <b>' + todayCount + '</b> · 누적 방문 <b>' + totalCount + '</b>';
  }
  fetch(base + totalKey)
    .then(function(r) { return r.json(); })
    .then(function(d) { totalCount = d.value; updateCounterDisplay(); })
    .catch(function() {
      var el = document.getElementById('visitorCounter');
      if (el) el.style.display = 'none';
    });
  fetch(base + todayKey)
    .then(function(r) { return r.json(); })
    .then(function(d) { todayCount = d.value; updateCounterDisplay(); })
    .catch(function() {});
})();

render();
</script>
</body>
</html>
