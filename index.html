<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --bg:#0A1420;
    --surface:#0F1F2E;
    --surface-2:#132738;
    --line:rgba(234,243,240,0.08);
    --teal:#12615A;
    --teal-light:#1C9187;
    --gold:#CBA35C;
    --text:#EAF3F0;
    --text-muted:#8098A6;
    --danger:#C96A5A;
    --price-down:#4A8FE0;
    --radius:14px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ── 상단 티커: 구별 평균 변동률 흐름 ── */
  .ticker-wrap{
    background:var(--surface-2);
    border-bottom:1px solid var(--line);
    overflow:hidden;
    white-space:nowrap;
    padding:7px 0;
  }
  .ticker{
    display:inline-block;
    padding-left:100%;
    animation:scroll 32s linear infinite;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--text-muted);
  }
  .ticker span{margin-right:36px;}
  .up{color:var(--danger);}
  .down{color:var(--price-down);}
  @keyframes scroll{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}
  @media (prefers-reduced-motion: reduce){
    .ticker{animation:none;padding-left:16px;}
  }

  /* ── 헤더 ── */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 32px 18px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:16px;}
  .brand-mark{
    width:46px;height:46px;border-radius:11px;
    background:linear-gradient(155deg,var(--teal),#0A2E2B);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:17px;letter-spacing:-0.5px;
    border:1px solid var(--line);
  }
  .brand h1{
    font-size:21px;font-weight:800;letter-spacing:-0.3px;margin:0;
  }
  .brand .sub{
    font-size:11.5px;color:var(--text-muted);margin-top:2px;
    letter-spacing:0.2px;
  }
  .char-wrap{
    display:flex;align-items:center;gap:10px;
  }
  .char-avatar{
    width:52px;height:52px;border-radius:50%;
    border:2px solid var(--teal-light);
    object-fit:cover;background:var(--surface-2);
  }
  .char-avatar-fallback{
    width:52px;height:52px;border-radius:50%;
    border:2px solid var(--teal-light);
    background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--text-muted);text-align:center;
  }
  .char-caption{font-size:10.5px;color:var(--text-muted);line-height:1.3;max-width:110px;}

  /* ── 구 선택 (1뎁스) ── */
  .gu-nav{
    display:flex;gap:10px;padding:20px 32px 0;
  }
  .gu-btn{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    cursor:pointer;
    text-align:left;
    transition:border-color .15s, background .15s;
  }
  .gu-btn:hover{border-color:var(--teal-light);}
  .gu-btn.active{
    background:linear-gradient(135deg, var(--teal), #0B2B28);
    border-color:var(--teal-light);
  }
  .gu-btn .name{font-size:16px;font-weight:700;}
  .gu-btn .stat{font-size:12px;color:var(--text-muted);margin-top:5px;font-family:'IBM Plex Mono',monospace;}
  .gu-btn.active .stat{color:#CFE8E3;}
  .badge-limited{
    display:inline-block;margin-left:6px;font-size:10px;
    background:rgba(203,163,92,0.18);color:var(--gold);
    border:1px solid rgba(203,163,92,0.4);
    border-radius:20px;padding:2px 8px;font-weight:600;
  }

  /* ── 동 선택 (2뎁스, 칩) ── */
  .dong-nav{
    display:flex;flex-wrap:wrap;gap:8px;
    padding:16px 32px 0;
  }
  .dong-chip{
    background:transparent;border:1px solid var(--line);
    color:var(--text-muted);border-radius:20px;
    padding:7px 14px;font-size:13px;cursor:pointer;
  }
  .dong-chip.active{
    background:var(--teal-light);color:#06201D;border-color:var(--teal-light);font-weight:600;
  }

  .share-btn{
    width:100%;margin-top:14px;background:var(--surface);border:1px solid var(--teal-light);
    color:var(--teal-light);border-radius:8px;padding:11px;font-weight:700;font-size:13px;
    cursor:pointer;transition:background .15s;
  }
  .share-btn:hover{background:rgba(28,145,135,0.12);}

  /* ── 접이식 패널(요약 → 클릭하면 상세) ── */
  .collapse-header{
    display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;padding:2px 0;
  }
  .collapse-header .chevron{
    transition:transform .2s;color:var(--text-muted);font-size:12px;
  }
  .collapse-header.open .chevron{transform:rotate(180deg);}
  .collapse-body{display:none;margin-top:12px;}
  .collapse-body.open{display:block;}
  .collapse-summary{font-size:12px;color:var(--text-muted);}

  /* ── 기능 탭 (3뎁스) ── */
  .feature-tabs{
    display:flex;gap:4px;padding:20px 32px 0;
    border-bottom:1px solid var(--line);
  }
  .feature-tab{
    background:none;border:none;color:var(--text-muted);
    font-size:14px;font-weight:600;padding:10px 16px;
    cursor:pointer;border-bottom:2px solid transparent;
  }
  .feature-tab.active{color:var(--text);border-bottom-color:var(--gold);}
  .feature-tab:disabled{opacity:0.35;cursor:not-allowed;}

  main{padding:28px 32px 60px;}

  /* ── 요약 카드 그리드 ── */
  .summary-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;
  }
  .stat-card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px 20px;
  }
  .stat-card .label{font-size:12px;color:var(--text-muted);}
  .stat-card .value{
    font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;margin-top:8px;
  }
  .stat-card .delta{font-size:12px;margin-top:4px;font-family:'IBM Plex Mono',monospace;}

  /* ── 콘텐츠 패널 ── */
  .panel{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:22px;margin-bottom:18px;
  }
  .panel h2{font-size:15px;margin:0 0 14px;font-weight:700;}
  /* 표는 셀 안에서 글자가 세로로 꺾이지 않게 하고, 대신 표 전체를 가로 스크롤 */
  table{
    display:block;width:100%;max-width:100%;
    overflow-x:auto;-webkit-overflow-scrolling:touch;
    border-collapse:collapse;font-size:13px;white-space:nowrap;
  }
  th{
    text-align:left;color:var(--text-muted);font-weight:500;
    font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  td{padding:10px 10px;border-bottom:1px solid var(--line);font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  .tag-gap{
    background:rgba(203,163,92,0.15);color:var(--gold);
    border-radius:6px;padding:2px 7px;font-size:11px;font-family:'Pretendard';
  }

  .empty-state{
    text-align:center;padding:50px 20px;color:var(--text-muted);
  }
  .empty-state .icon{font-size:30px;margin-bottom:10px;}

  /* ── 연락처 배너 ── */
  .contact-banner{
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(135deg, var(--teal), #0B2B28);
    color:#EAF9F5;text-decoration:none;font-weight:700;font-size:14px;
    padding:12px 16px;text-align:center;
  }
  .contact-banner:hover{filter:brightness(1.08);}
  .phone-icon{font-size:15px;}
  .cta-phone-alt{
    text-align:center;font-size:12.5px;color:var(--text-muted);margin-top:12px;
  }
  .cta-phone-alt a{color:var(--teal-light);font-weight:700;text-decoration:none;}

  /* ── 앱 설치 배너 ── */
  .install-banner{
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(135deg, var(--gold), #7A5C22);
    color:#1A1408;text-decoration:none;font-weight:700;font-size:14px;
    padding:12px 16px;text-align:center;cursor:pointer;border:none;width:100%;
  }
  .install-banner:hover{filter:brightness(1.06);}
  .install-modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .install-modal{
    background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;
    padding:24px 22px 28px;width:100%;max-width:480px;
  }
  .install-modal h3{font-size:16px;margin:0 0 14px;}
  .install-modal ol{margin:0;padding-left:20px;font-size:14px;line-height:1.9;color:var(--text-primary);}
  .install-modal .close-btn{
    display:block;width:100%;margin-top:18px;background:var(--teal);color:#fff;border:none;
    border-radius:10px;padding:12px;font-weight:700;font-size:14px;cursor:pointer;
  }

  /* ── 문의 폼 ── */
  .inquiry-toggle-btn{
    width:100%;background:linear-gradient(135deg, var(--teal-light), var(--teal));
    border:none;border-radius:var(--radius);padding:16px;cursor:pointer;
    color:#06201D;text-align:left;
  }
  .inquiry-toggle-main{display:block;font-size:15px;font-weight:800;}
  .inquiry-toggle-sub{display:block;font-size:12px;margin-top:3px;opacity:0.8;}
  .inquiry-card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .inquiry-card-title{font-weight:700;font-size:14px;margin-bottom:12px;}
  .form-row{margin-bottom:10px;}
  .form-label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:4px;}
  .form-input,.form-select{
    width:100%;padding:9px 10px;background:var(--surface);border:1px solid var(--line);
    border-radius:8px;color:var(--text);font-family:'Pretendard';font-size:13px;
  }
  .form-range-row{display:flex;gap:8px;}
  .hp-field{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;}
  .inquiry-error{color:var(--danger);font-size:12px;margin:6px 0;}
  .form-submit-btn{
    width:100%;background:var(--gold);color:#2B2110;border:none;border-radius:8px;
    padding:12px;font-weight:800;font-size:14px;cursor:pointer;margin-top:4px;
  }
  .form-submit-btn:disabled{opacity:0.6;cursor:not-allowed;}
  .inquiry-privacy-note{font-size:10.5px;color:var(--text-muted);margin-top:8px;line-height:1.4;}
  .inquiry-done-card{text-align:center;padding:30px 16px;}
  .inquiry-done-icon{font-size:28px;margin-bottom:8px;}
  .inquiry-done-text{font-weight:700;font-size:14px;}

  .footer{
    padding:24px 32px 40px;color:var(--text-muted);font-size:12px;
    border-top:1px solid var(--line);margin-top:20px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .footer .brand-small{font-weight:700;color:var(--text);}

  @media (max-width:900px){
    .summary-grid{grid-template-columns:repeat(2,1fr);}
    .gu-nav{flex-direction:column;}
    header,.gu-nav,.dong-nav,.feature-tabs,main,.footer{padding-left:16px;padding-right:16px;}
    .footer{flex-direction:column;align-items:flex-start;gap:10px;}
  }  /* ── 인쇄(레포트) 버튼 ── */
  .print-fab{
    position:fixed;right:18px;bottom:18px;z-index:500;
    width:52px;height:52px;border-radius:50%;border:none;
    background:linear-gradient(135deg, var(--teal), #0B2B28);
    color:#fff;font-size:22px;box-shadow:0 4px 16px rgba(0,0,0,0.4);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .print-fab:hover{filter:brightness(1.1);}
  .print-only{display:none;}

  /* ── 인쇄용 스타일: 화면용 다크 테마 대신 종이에 맞는 밝은 레이아웃으로 전환 ── */
  @media print{
    body{background:#fff !important;color:#111 !important;}
    .ticker-wrap,.gu-nav,.dong-nav,#typeToggle,.feature-tabs,
    .contact-banner,#installBanner,#iosInstallModal,.print-fab,
    .footer,.share-btn,.dong-chip,.close-btn,
    .inquiry-form,.summary-cta,.char-wrap{display:none !important;}
    .print-only{display:block !important;}
    header{padding:0 0 12px !important;border:none !important;}
    header .brand-mark{background:var(--teal) !important;color:#fff !important;}
    header h1{color:#111 !important;}
    header .sub{color:#555 !important;}
    #printHeader{
      padding:0 0 14px;margin-bottom:14px;border-bottom:2px solid #12615a;
      font-size:12px;color:#444;
    }
    #printHeader .title{font-size:19px;font-weight:800;color:#111;margin-bottom:4px;}
    main{padding:0 !important;}
    .panel{
      background:#fff !important;border:1px solid #ccc !important;
      box-shadow:none !important;page-break-inside:avoid;margin-bottom:14px !important;
    }
    .panel h2{color:#111 !important;}
    .stat-card{background:#f5f5f5 !important;border:1px solid #ddd !important;}
    .stat-card .label{color:#555 !important;}
    .stat-card .value{color:#111 !important;}
    .collapse-header{cursor:default !important;}
    .collapse-header .chevron{display:none !important;}
    .collapse-body{display:block !important;max-height:none !important;}
    /* 화면에서는 nowrap+가로스크롤이던 표를, 인쇄에서는 줄바꿈 허용해 페이지 폭에 맞춤 */
    table{
      display:table !important;overflow-x:visible !important;white-space:normal !important;
      font-size:10.5px !important;
    }
    th,td{white-space:normal !important;color:#111 !important;border-color:#ddd !important;}
    th{color:#555 !important;}
    tr{page-break-inside:avoid;}
    a{color:#12615a !important;text-decoration:none !important;}
    .tag-gap{background:#eee !important;color:#333 !important;}
  }
</style>
</head>

function normalizeComplexName(name){
  return String(name||'').replace(/\s+/g,'').replace(/\(.*?\)/g,'');
}

/* COMPLEX_STATS에서 특정 단지의 실거래 통계를 찾음 — 정확히 일치하는 키가 없으면
   괄호·공백을 무시한 정규화 이름으로 재검색 (예: "OO(주상복합)" ↔ "OO") */
function resolveComplexStats(gu, type, complexName){
  const bucket = (COMPLEX_STATS[gu] || {})[type] || {};
  if(bucket[complexName]) return bucket[complexName];
  const norm = normalizeComplexName(complexName);
  const matchKey = Object.keys(bucket).find(k => normalizeComplexName(k) === norm);
  return matchKey ? bucket[matchKey] : null;
}

/* 예측 가능한 단지 목록 — 매물 데이터가 있는(추적 중인) 단지만 노출 (실거래만 있고 매물 없는 단지는 제외) */
function predictComplexList(gu, type){

}

function floorTierOf(floorStr){
  if(!floorStr) return null;
  const s = String(floorStr).trim();
  if(s.startsWith('저')) return '저';
  if(s.startsWith('중')) return '중';
  if(s.startsWith('고')) return '고';
  const m = s.match(/^(\d+)\s*\/\s*(\d+)$/);
  if(!m) return null;
  const cur = Number(m[1]), total = Number(m[2]);
  if(!total) return null;
  const ratio = cur / total;
  if(ratio <= 1/3) return '저';
  if(ratio <= 2/3) return '중';
  return '고';
}

function areaBucketOf(area){
  if(area===null || area===undefined || isNaN(area)) return null;
  if(area<60) return "60㎡ 이하";
  if(area<85) return "60-85㎡";
  if(area<110) return "85-110㎡";
  if(area<135) return "110-135㎡";
  return "135㎡ 이상";
}

function fmtPct(v){
  if(v===null || v===undefined) return {text:'-', up:true};
  const up = v>=0;
  return {text:(up?'▲':'▼')+Math.abs(v).toFixed(1)+'%', up};
}

    return `<button class="dong-chip ${activeCls}" onclick="selectType('${t}')">${t}${badge}</button>`;

function renderTicker(){
  const el = document.getElementById('tickerEl');
  const dongMap = complexDongMap();
  let items = [];
  Object.keys(REAL).forEach(gu=>{
    const d = REAL[gu];
    const pct = fmtPct(d.changePct);
    items.push(`<span>${gu} 최근30일 평균단가 <span class="${pct.up?'up':'down'}">${pct.text}</span></span>`);

    // 매물 추적 단지 기준, 84㎡ · 최근 1년 신고가 거래만 대상으로 동별 최고가
    const bestByDong = {}; // dong -> {complex, amount, date}
    Object.keys(REAL_TX['아파트'] || {}).forEach(complex=>{
      const complexGu = LISTINGS_ALL.find(l=>l.complex===complex && l.type==='아파트')?.gu;
      if(complexGu !== gu) return;
      const dong = dongMap[complex];
      if(!dong) return;
      REAL_TX['아파트'][complex].forEach(t=>{
        if(t.sizeFloor !== 84) return;
        if(!t.isRecordHigh) return;
        if(!bestByDong[dong] || t.amount > bestByDong[dong].amount){
          bestByDong[dong] = { complex, amount: t.amount, date: t.date };
        }
      });
    });
    Object.entries(bestByDong)
      .sort((a,b)=> b[1].amount - a[1].amount)
      .forEach(([dong, best])=>{
        items.push(`<span>${gu} ${dong} ${best.complex} 84㎡ ${best.amount}억</span>`);
      });
  });
  el.innerHTML = (items.concat(items)).join('');
}

function getListingSummary(){
  const guData = APT_LISTINGS[state.gu] && APT_LISTINGS[state.gu][state.housingType];
  if(!guData) return null;
  if(state.dong==='전체'){
    let all = [];
    Object.entries(guData).forEach(([dong, dd])=> dd.recent.forEach(r=>all.push(Object.assign({dong}, r))));
    all.sort((a,b)=> b.checkedDate.localeCompare(a.checkedDate));
    const totalCount = Object.values(guData).reduce((s,dd)=>s+dd.count,0);
    const totalGap = Object.values(guData).reduce((s,dd)=>s+dd.gapCount,0);
    const avgPrice = Object.values(guData).reduce((s,dd)=>s+dd.avgPrice*dd.count,0)/totalCount;
    return { count: totalCount, avgPrice: Math.round(avgPrice*100)/100, gapPct: Math.round(totalGap/totalCount*1000)/10, recent: all.slice(0,10) };
  } else {
    const dd = guData[state.dong];
    if(!dd) return { count:0, avgPrice:0, gapPct:0, recent:[] };
    return { count: dd.count, avgPrice: dd.avgPrice, gapPct: dd.gapPct, recent: dd.recent.map(r=>Object.assign({dong:state.dong}, r)) };
  }
}

function complexDongMap(){
  // LISTINGS_ALL 기준 단지별 대표 동(가장 많이 등장하는 동)
  const map = {};
  LISTINGS_ALL.forEach(l=>{
    if(!map[l.complex]) map[l.complex] = {};
    map[l.complex][l.dong] = (map[l.complex][l.dong]||0) + 1;
  });
  const result = {};
  Object.keys(map).forEach(c=>{
    result[c] = Object.entries(map[c]).sort((a,b)=>b[1]-a[1])[0][0];
  });
  return result;
}

function trackedRealTxList(){
  const dongMap = complexDongMap();
  const txForType = REAL_TX[state.housingType] || {};
  let rows = [];
  Object.keys(txForType).forEach(complex=>{
    const complexGu = LISTINGS_ALL.find(l=>l.complex===complex && l.type===state.housingType)?.gu;
    if(complexGu !== state.gu) return;
    const dong = dongMap[complex];
    if(state.dong!=='전체' && dong!==state.dong) return;
    if(state.realprice.complex!=='전체' && complex!==state.realprice.complex) return;
    txForType[complex].forEach(t=>{
      if(state.realprice.area!=='전체' && t.sizeFloor!==Number(state.realprice.area)) return;
      rows.push(Object.assign({complex, dong}, t));
    });
  });
  rows.sort((a,b)=> b.date.localeCompare(a.date));
  return rows;
}

function realComplexBreakdown(){
  const dongMap = complexDongMap();
  const txForType = REAL_TX[state.housingType] || {};
  const byComplex = {};
  Object.keys(txForType).forEach(complex=>{
    const complexGu = LISTINGS_ALL.find(l=>l.complex===complex && l.type===state.housingType)?.gu;
    if(complexGu !== state.gu) return;
    const dong = dongMap[complex];
    if(state.dong!=='전체' && dong!==state.dong) return;
    const items = txForType[complex];
    if(!items.length) return;
    const amounts = items.map(t=>t.amount);
    byComplex[complex] = {
      complex, dong, count: items.length,
      avgPrice: Math.round(amounts.reduce((a,b)=>a+b,0)/amounts.length*100)/100,
      minPrice: Math.min(...amounts), maxPrice: Math.max(...amounts),
    };
  });
  return Object.values(byComplex).sort((a,b)=> b.count-a.count);
}

function realTable(rows){
  if(!rows.length) return emptyState('표시할 거래 데이터가 없습니다','해당 범위에 최근 거래가 없습니다');

    <thead><tr><th>동</th><th>단지</th><th>전용면적</th><th>층</th><th>계약일</th><th>거래금액</th></tr></thead>
    <tbody>
      ${rows.map(r=>`<tr>
        <td style="font-family:'Pretendard'">${r.dong}</td>
        <td style="font-family:'Pretendard'">${r.name}</td>
        <td>${Math.floor(r.area)}㎡</td>
        <td>${r.floor ?? '-'}층</td>
        <td>${r.dateShort}</td>
        <td>${r.price}억</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

/* 단지별로 묶어서 반복 표시 없이 한눈에 보이게. 그룹 순서는 첫 등장 순서를 유지. */
function groupRowsByComplex(rows){
  const order = [];
  const map = {};
  rows.forEach(r=>{
    if(!map[r.complex]){ map[r.complex] = []; order.push(r.complex); }
    map[r.complex].push(r);
  });
  return order.map(complex=>({complex, rows: map[complex]}));
}

function listingTable(rows){
  if(!rows.length) return emptyState('표시할 매물이 없습니다','해당 범위에 매물 데이터가 없습니다');
  const groups = groupRowsByComplex(rows);
  return groups.map(({complex, rows: grp})=>{
    const dotColor = COLORS[complex] || DEFAULT_COLOR;
    return `<div style="margin-bottom:16px;">
      <div style="font-weight:700;font-size:13.5px;margin-bottom:6px;font-family:'Pretendard';">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${dotColor};margin-right:6px;"></span>${complex}
      </div>
      <table>
        <thead><tr><th>동·타입</th><th>층</th><th>향</th><th>가격</th><th>비고</th></tr></thead>
        <tbody>
          ${grp.map(r=>{
            const type = (r.unitType !== undefined ? r.unitType : r.type) || '';
            const dongType = r.building ? `${r.building}동 · ${type}` : type;
            return `<tr>
            <td style="font-family:'Pretendard'">${dongType}</td>
            <td>${r.floor}</td>
            <td style="font-family:'Pretendard'">${r.direction ?? '-'}</td>
            <td>${r.price}억</td>
            <td>${r.gap ? '<span class="tag-gap">갭투자</span>' : '-'}</td>
          </tr>`;}).join('')}
        </tbody>
      </table>
    </div>`;
  }).join('');
}

/* 접이식 패널: 클릭 전엔 요약 한 줄, 클릭하면 상세 테이블/내용이 펼쳐짐 */
let collapseIdCounter = 0;
function collapsiblePanel(titleHtml, summaryText, bodyHtml, defaultOpen){
  const id = 'collapse-' + (collapseIdCounter++);
  const openCls = defaultOpen ? 'open' : '';
  return `<div>
    <div class="collapse-header ${openCls}" onclick="toggleCollapse('${id}', this)">
      <div>${titleHtml} <span class="collapse-summary">${summaryText}</span></div>
      <span class="chevron">▾</span>
    </div>
    <div class="collapse-body ${openCls}" id="${id}">${bodyHtml}</div>
  </div>`;
}
function toggleCollapse(id, headerEl){
  const body = document.getElementById(id);
  const isOpen = body.classList.contains('open');
  if(isOpen){ body.classList.remove('open'); headerEl.classList.remove('open'); }
  else { body.classList.add('open'); headerEl.classList.add('open'); }
}

function emptyState(title, sub){
  return `<div class="empty-state"><div class="icon">◧</div><div style="font-weight:600;margin-bottom:4px;">${title}</div><div style="font-size:12px;">${sub}</div></div>`;
}

function complexBreakdown(){
  // 예산/평형/갭 필터와 무관하게, 현재 구·동·주택유형 범위의 단지별 현황
  const scoped = LISTINGS_ALL.filter(l=>{
    if(l.gu!==state.gu) return false;
    if(l.type!==state.housingType) return false;
    if(state.dong!=='전체' && l.dong!==state.dong) return false;
    return true;
  });
  const byComplex = {};
  scoped.forEach(l=>{
    if(!byComplex[l.complex]) byComplex[l.complex] = { dong:l.dong, items:[] };
    byComplex[l.complex].items.push(l);
  });
  return Object.entries(byComplex).map(([complex, d])=>{
    const items = d.items;
    const prices = items.map(i=>i.price);
    const gapCount = items.filter(i=>i.gap).length;
    return {
      complex, dong: d.dong, count: items.length,
      avgPrice: Math.round(prices.reduce((a,b)=>a+b,0)/prices.length*100)/100,
      minPrice: Math.min(...prices), maxPrice: Math.max(...prices),
      gapCount, gapPct: Math.round(gapCount/items.length*1000)/10,
    };
  }).sort((a,b)=> b.count-a.count);
}

function complexTable(rows){
  if(!rows.length) return emptyState('단지 데이터가 없습니다','해당 범위에 매물이 없습니다');
  return `<table>
    <thead><tr><th>단지</th><th>동</th><th>매물수</th><th>평균호가</th><th>가격범위</th><th>갭투자</th></tr></thead>
    <tbody>
      ${rows.map(r=>{
        const activeRow = state.finder.complex===r.complex;
        const dotColor = COLORS[r.complex] || DEFAULT_COLOR;
        return `<tr onclick="setFinderComplex('${r.complex.replace(/'/g,"\\'")}')" style="cursor:pointer;${activeRow?'background:rgba(28,145,135,0.12);':''}">
        <td style="font-family:'Pretendard'"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${dotColor};margin-right:6px;"></span>${r.complex}${activeRow?' <span style="color:var(--teal-light);">●</span>':''}</td>
        <td style="font-family:'Pretendard'">${r.dong}</td>
        <td>${r.count}건</td>
        <td>${r.avgPrice}억</td>
        <td>${r.minPrice}~${r.maxPrice}억</td>
        <td>${r.gapCount>0 ? `<span class="tag-gap">${r.gapCount}건 (${r.gapPct}%)</span>` : '-'}</td>
      </tr>`;}).join('')}
    </tbody>
  </table>
  <div style="font-size:11.5px;color:var(--text-muted);margin-top:8px;">단지를 탭하면 아래 필터·결과가 그 단지로 좁혀집니다.</div>`;
}

function filteredListings(){
  const range = BUDGET_RANGES.find(b=>b.label===state.finder.budget) || BUDGET_RANGES[0];
  return LISTINGS_ALL.filter(l=>{
    if(l.gu!==state.gu) return false;
    if(l.type!==state.housingType) return false;
    if(state.dong!=='전체' && l.dong!==state.dong) return false;
    if(state.finder.complex!=='전체' && l.complex!==state.finder.complex) return false;
    if(l.price<range.min || l.price>=range.max) return false;
    if(state.finder.complex!=='전체'){
      if(state.finder.exactArea!=='전체' && Math.floor(l.area)!==Number(state.finder.exactArea)) return false;
    } else {
      if(state.finder.areaBucket!=='전체' && areaBucketOf(l.area)!==state.finder.areaBucket) return false;
    }
    if(state.finder.gapOnly && !l.gap) return false;
    return true;
  });
}

function exactAreasForComplex(){
  if(state.finder.complex==='전체') return [];
  const scoped = LISTINGS_ALL.filter(l=> l.gu===state.gu && l.type===state.housingType && l.complex===state.finder.complex && (state.dong==='전체'||l.dong===state.dong));
  const areas = [...new Set(scoped.map(l=>Math.floor(l.area)))].sort((a,b)=>a-b);
  return areas;
}

function renderSnapshotDiffPanel(){
  const complexGuMap = {};
  LISTINGS_ALL.forEach(l=>{ complexGuMap[l.complex] = l.gu; });
  const hasSnapshot = SNAPSHOT_DIFF.gone.some(l=>l.gu===state.gu) || SNAPSHOT_DIFF.fresh.some(l=>l.gu===state.gu) || SNAPSHOT_DIFF.changed.some(c=>complexGuMap[c.complex]===state.gu);
  if(!hasSnapshot){
    return `<div class="panel" style="opacity:0.75;">
      <h2>매물 변동추이 · 소멸매물 추적</h2>
      <p style="color:var(--text-muted);font-size:13px;">${state.gu}는 아직 2개 이상의 매물 스냅샷이 없어 추이·소멸 분석을 할 수 없습니다.</p>
    </div>`;
  }
  const filterFn = l => l.gu===state.gu && l.type===state.housingType && (state.dong==='전체' || (complexDongMap()[l.complex]||l.dong)===state.dong);
  const fresh = SNAPSHOT_DIFF.fresh.filter(filterFn);
  const gone = SNAPSHOT_DIFF.gone.filter(filterFn);
  const changed = SNAPSHOT_DIFF.changed.filter(c => c.type===state.housingType && complexGuMap[c.complex]===state.gu && (state.dong==='전체' || (complexDongMap()[c.complex])===state.dong));

  const findCurrentDirection = (complex, building, floor, unitType) => {
    const m = LISTINGS_ALL.find(l=> l.complex===complex && l.building===building && l.floor===floor && l.unitType===unitType);
    return m ? m.direction : null;
  };

  const rowsHtml = (arr, kind) => {
    if(!arr.length) return `<div style="color:var(--text-muted);font-size:12.5px;padding:8px 0;">해당 없음</div>`;
    return `<table><thead><tr><th>단지</th><th>동</th><th>층</th><th>타입</th><th>향</th>${kind==='changed' ? '<th>가격변동</th>' : '<th>가격</th>'}</tr></thead><tbody>
      ${arr.map(l=>{
        const dotColor = COLORS[l.complex] || DEFAULT_COLOR;
        const nameCell = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${dotColor};margin-right:6px;"></span>${l.complex}`;
        if(kind==='changed'){
          const diffColor = l.diff>0 ? 'var(--danger)' : 'var(--price-down)';
          const arrow = l.diff>0 ? '▲' : '▼';
          const dir = findCurrentDirection(l.complex, l.building, l.floor, l.unitType);
          return `<tr><td style="font-family:'Pretendard'">${nameCell}</td><td style="font-family:'Pretendard'">${l.building}동</td><td>${l.floor}</td><td>${l.unitType}</td><td style="font-family:'Pretendard'">${dir||''}</td><td>${l.oldPrice}억 → ${l.newPrice}억 <span style="color:${diffColor};">${arrow}${Math.abs(l.diff)}억</span></td></tr>`;
        }
        return `<tr><td style="font-family:'Pretendard'">${nameCell}</td><td style="font-family:'Pretendard'">${l.building}동</td><td>${l.floor}</td><td>${l.unitType}</td><td style="font-family:'Pretendard'">${l.direction||''}</td><td>${l.price}억</td></tr>`;
      }).join('')}
    </tbody></table>`;
  };

  return `<div class="panel">
    <h2>매물 변동추이 · 소멸매물 추적</h2>
    <p style="color:var(--text-muted);font-size:13px;margin-top:-6px;margin-bottom:14px;">${SNAPSHOT_DIFF.oldDate} → ${SNAPSHOT_DIFF.newDate} 스냅샷 비교 · 동·층·타입 매칭 기준 (기흥역세권 6개 단지)</p>
    <div class="summary-grid" style="margin-bottom:18px;">
      <div class="stat-card"><div class="label">🆕 신규 매물</div><div class="value" style="color:var(--teal-light);">${fresh.length}건</div></div>
      <div class="stat-card"><div class="label">💨 소멸 매물</div><div class="value" style="color:var(--danger);">${gone.length}건</div></div>
      <div class="stat-card"><div class="label">💰 가격변동</div><div class="value" style="color:var(--gold);">${changed.length}건</div></div>
      <div class="stat-card"><div class="label">비교 기준</div><div class="value" style="font-size:16px;">동·층·타입</div></div>
    </div>
    <div style="margin-bottom:16px;">
      ${collapsiblePanel('<span style="font-weight:700;color:var(--teal-light);">🆕 신규 매물</span>', `${fresh.length}건 — 탭해서 보기`, rowsHtml(fresh, 'fresh'))}
    </div>

}

    <div class="form-row"><label class="form-label">${priceLabel}</label>

    <div class="inquiry-privacy-note">남겨주신 연락처는 문의 상담 목적으로만 사용되며, 담당 공인중개사에게 직접 전달됩니다.</div>

function openInquiry(kind){
  state.inquiry.open = true;
  state.inquiry.kind = kind;
  state.inquiry.done = false;
  state.inquiry.error = '';
  render();
}

function syncInquiryFromDOM(){
  const s = state.inquiry;
  const get = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const phone = get('inqPhone'); if(phone!==undefined) s.phone = phone;
  const category = get('inqCategory'); if(category!==undefined) s.category = category;
  const complex = get('inqComplex'); if(complex!==undefined) s.complex = complex;
  const dong = get('inqDong'); if(dong!==undefined) s.dong = dong;
  const ho = get('inqHo'); if(ho!==undefined) s.ho = ho;
  const price = get('inqPrice'); if(price!==undefined) s.price = price;
  const name = get('inqName'); if(name!==undefined) s.name = name;
  const message = get('inqMessage'); if(message!==undefined) s.message = message;
}

function submitInquiry(){
  const s = state.inquiry;
  const isSell = s.kind === 'sell';
  syncInquiryFromDOM();
  if(!/^[0-9\-+ ]{9,20}$/.test((s.phone||'').trim())){ s.error = '연락처를 정확히 입력해주세요 (예: 010-1234-5678).'; render(); return; }
  if(isSell && !s.complex){ s.error = '단지를 선택해주세요.'; render(); return; }
  if(!s.price || isNaN(parseFloat(s.price)) || parseFloat(s.price)<=0){ s.error = isSell ? '희망 매도가를 입력해주세요.' : '희망 매수 예산을 입력해주세요.'; render(); return; }
  s.error = '';
  s.submitting = true;
  render();
  const websiteEl = document.getElementById('inqWebsite');
  let propertyRef = [state.gu, state.dong!=='전체'?state.dong:null, s.complex||null].filter(Boolean).join(' ');
  if(isSell && (s.dong || s.ho)){
    propertyRef += ` ${s.dong?s.dong+'동':''} ${s.ho?s.ho+'호':''}`.trim();
  }
  fetch(CRM_LEADS_URL, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      type: isSell ? 'sell' : 'buy',
      name: (s.name||'').trim(),
      phone: s.phone.trim(),
      category: s.category,
      dealType: '매매',
      message: (s.message||'').trim(),
      propertyRef: propertyRef,
      budgetEok: parseFloat(s.price),
      askingPriceEok: isSell ? parseFloat(s.price) : null,
      source: '리치아파트 대시보드',
      website: websiteEl ? websiteEl.value : ''
    })
  }).then(res=>{
    if(!res.ok) throw new Error('request failed');
    return res.json();
  }).then(()=>{
    s.submitting = false;
    s.done = true;
    render();
  }).catch(()=>{
    s.submitting = false;
    s.error = '문의 접수에 실패했습니다. 상단 전화번호로 문의해주세요.';
    render();
  });
}

function renderPredictPanel(scopeLabel){
  const complexList = predictComplexList(state.gu, state.housingType);
  if(!complexList.length){
    return `<div class="panel"><h2>내집시세예측</h2><p style="color:var(--text-muted);font-size:13px;">${state.gu} · ${state.housingType}는 아직 매물 데이터가 있는 단지가 없어 예측할 수 없습니다.</p></div>`;
  }
  if(!state.predict.complex || !complexList.includes(state.predict.complex)){
    state.predict.complex = complexList[0];
  }
  const complex = state.predict.complex;
  const floor = state.predict.floor;

  // 선택 가능한 평형: 매물 데이터의 정확한 전용면적(버림) + 실거래 통계에만 있는 평형도 함께 노출
  // (매물이 없어도 국토부 실거래만으로 예측 가능한 평형은 목록에서 빠지지 않게 함)
  const listingAreas = LISTINGS_ALL.filter(l=>l.gu===state.gu && l.complex===complex && l.type===state.housingType).map(l=>Math.floor(l.area));
  const statAreas = Object.keys(resolveComplexStats(state.gu, state.housingType, complex) || {}).map(Number);
  const exactAreas = [...new Set([...listingAreas, ...statAreas])].sort((a,b)=>a-b);
  if(exactAreas.length){
    if(!exactAreas.includes(state.predict.area)){
      // 가장 가까운 값으로 기본 선택
      state.predict.area = exactAreas.reduce((best,a)=> Math.abs(a-84)<Math.abs(best-84) ? a : best, exactAreas[0]);
    }
  }
  const area = state.predict.area;
  const bucket = areaBucketOf(area);
  const areaKey = String(Math.floor(area));

  // 향 옵션은 해당 단지·정확한 평형(㎡)에 실제 존재하는 값만 노출 (실거래에는 향 정보가 없어 매물 기준)
  const complexExactListings = LISTINGS_ALL.filter(l=> l.gu===state.gu && l.complex===complex && l.type===state.housingType && Math.floor(l.area)===Number(areaKey));

  const complexStatsForType = resolveComplexStats(state.gu, state.housingType, complex) || {};
  const areaStatData = complexStatsForType[areaKey]; // { _all:{avg,count}, "203":{avg,count}, ... }
  const statAll = areaStatData ? areaStatData._all : null;

  const MIN_SAMPLE = 2; // 표본이 이보다 적으면 신뢰하지 않고 상위 범위로 폴백

  // 타입(예: 84A/84B) 옵션 — 같은 평형이라도 타입별로 구조·가격이 다를 수 있어 매물 기준으로 반영
  const typeOptions = [...new Set(complexExactListings.map(l=>l.unitType).filter(Boolean))].sort();
  if(!typeOptions.includes(state.predict.unitType)) state.predict.unitType = '전체';
  const unitType = state.predict.unitType;

  let typeListings = unitType==='전체' ? complexExactListings : complexExactListings.filter(l=>l.unitType===unitType);
  let typeFallback = false, typeLowSample = false;
  if(unitType!=='전체' && typeListings.length===0){
    typeListings = complexExactListings;
    typeFallback = true;
  } else if(unitType!=='전체' && typeListings.length>0 && typeListings.length<MIN_SAMPLE){
    typeLowSample = typeListings.length;
    typeListings = complexExactListings;
    typeFallback = true;
  }

  // 동(건물동) 옵션 — 특정 평형에 국한하지 않고, 이 단지에 실제 존재하는 모든 동을 매물+실거래 전체에서 모아 표시
  // (같은 동이라도 평형별로 최근 3개월 거래가 없을 수 있어, 동 자체는 단지 단위로 넓게 잡음)
  const complexAllListings = LISTINGS_ALL.filter(l=> l.gu===state.gu && l.complex===complex && l.type===state.housingType);
  const listingBuildings = complexAllListings.map(l=>l.building).filter(Boolean);
  const realBuildings = Object.values(complexStatsForType).flatMap(areaObj => Object.keys(areaObj).filter(k=>k!=='_all'));
  const buildingOptions = [...new Set([...listingBuildings, ...realBuildings])]
    .sort((a,b)=> a.localeCompare(b, undefined, {numeric:true}));
  if(!buildingOptions.includes(state.predict.building)) state.predict.building = '전체';
  const building = state.predict.building;

  let buildingListings = building==='전체' ? typeListings : typeListings.filter(l=>l.building===building);
  let buildingFallback = false, buildingLowSample = false;
  if(building!=='전체' && buildingListings.length===0){
    buildingListings = typeListings;
    buildingFallback = true;
  } else if(building!=='전체' && buildingListings.length>0 && buildingListings.length<MIN_SAMPLE){
    buildingLowSample = buildingListings.length;
    buildingListings = typeListings;
    buildingFallback = true;
  }

  const directionOptions = [...new Set(buildingListings.map(l=>l.direction).filter(Boolean))];
  if(!directionOptions.includes(state.predict.direction)) state.predict.direction = '전체';
  const direction = state.predict.direction;

  // 실거래 통계: 동을 선택했고 그 동의 실거래 데이터가 있으면 동 단위 통계, 없으면 단지 전체 평균으로 폴백
  let stat = statAll;
  let statBuildingFallback = false;
  if(building!=='전체'){
    if(areaStatData && areaStatData[building] && areaStatData[building].count>=MIN_SAMPLE){
      stat = areaStatData[building];
    } else if(statAll){
      stat = statAll;
      statBuildingFallback = true;
    }
  }

  // 매물 기준 매칭: 정확한 평형 + 타입 + 동 + 향까지 반영. 선택한 조건에 맞는 매물이 없거나 표본이 너무 적으면 자동 폴백.
  let listingMatches = direction==='전체' ? buildingListings : buildingListings.filter(l=>l.direction===direction);
  let directionFallback = false, directionLowSample = false;
  if(direction!=='전체' && listingMatches.length===0){
    listingMatches = buildingListings;
    directionFallback = true;
  } else if(direction!=='전체' && listingMatches.length>0 && listingMatches.length<MIN_SAMPLE){
    directionLowSample = listingMatches.length;
    listingMatches = buildingListings;
    directionFallback = true;
  }

  // 층(저/중/고) 매칭: 실제 그 층대 매물이 있으면 그 매물 평균을 쓰고, 있으면 층 보정(±3%)은 생략(이중 반영 방지).
  // 표본이 부족하면 폴백하고, 이 경우엔 기존처럼 ±3% 층 보정을 적용.
  const preFloorMatches = listingMatches;
  let floorTierMatches = preFloorMatches.filter(l=>floorTierOf(l.floor)===floor);
  let floorFallback = false, floorLowSample = false;
  if(floorTierMatches.length===0){
    floorFallback = true;
  } else if(floorTierMatches.length>0 && floorTierMatches.length<MIN_SAMPLE){
    floorLowSample = floorTierMatches.length;
    floorFallback = true;
  } else {
    listingMatches = floorTierMatches;
  }
  const listingAvg = listingMatches.length ? listingMatches.reduce((s,l)=>s+l.price,0)/listingMatches.length : null;

  let base = null, basisText = '', simpleBasis = '';
  const typeNote = unitType==='전체' ? '' : (typeFallback
    ? (typeLowSample ? ` (${unitType} 타입 매물 ${typeLowSample}건뿐이라 표본부족 → 전체 타입 평균 사용)` : ` (${unitType} 타입 매물 없어 전체 타입 평균 사용)`)
    : ` · ${unitType}`);
  const buildingNote = building==='전체' ? '' : (buildingFallback
    ? (buildingLowSample ? ` (${building}동 매물 ${buildingLowSample}건뿐이라 표본부족 → 전체 동 평균 사용)` : ` (${building}동 매물 없어 전체 동 평균 사용)`)
    : ` · ${building}동`);
  const directionNote = direction==='전체' ? '' : (directionFallback
    ? (directionLowSample ? ` (${direction} 매물 ${directionLowSample}건뿐이라 표본부족 → 향 무관 평균 사용)` : ` (${direction} 매물 없어 전체 향 평균 사용)`)
    : ` · ${direction}`);
  const floorNote = floorFallback
    ? (floorLowSample ? ` (${floor}층 매물 ${floorLowSample}건뿐이라 표본부족 → 층 무관 평균+±3% 보정 사용)` : ` (${floor}층 매물 없어 층 무관 평균+±3% 보정 사용)`)
    : ` · ${floor}층 매물 실측 반영`;
  const statBuildingNote = building==='전체' ? '' : (statBuildingFallback ? ` (${building}동 실거래 부족해 단지 전체 평균 사용)` : ` · ${building}동`);
  if(stat && listingAvg!==null){
    base = stat.avg*0.2 + listingAvg*0.8;
    basisText = `국토부 실거래(최근 3개월) ${stat.count}건(${areaKey}㎡${statBuildingNote} 평균 ${stat.avg}억) 20% + 리치부동산연구소 매물 ${listingMatches.length}건(평균 ${Math.round(listingAvg*100)/100}억${typeNote}${buildingNote}${directionNote}${floorNote}) 80% 가중평균`;
    simpleBasis = `국토부 실거래가 + 리치부동산연구소 매물 호가를 함께 반영한 추정가입니다.`;
  } else if(stat){
    base = stat.avg;
    basisText = `국토부 실거래(최근 3개월) ${stat.count}건(${areaKey}㎡${statBuildingNote}) 평균가 기준 (해당 조건 매물 데이터 없음)`;
    simpleBasis = `국토부 실거래가를 기준으로 산정했습니다.`;
  } else if(listingAvg!==null){
    base = listingAvg;
    basisText = `리치부동산연구소 매물 ${listingMatches.length}건(${areaKey}㎡) 평균 호가 기준${typeNote}${buildingNote}${directionNote}${floorNote} (최근 3개월 실거래 데이터 없음)`;
    simpleBasis = `현재 나와 있는 매물 호가를 기준으로 산정했습니다.`;
  }

  // 실제 그 층대 매물로 계산됐으면 이미 층 프리미엄이 반영된 것이므로 추가 보정을 생략(이중 반영 방지).
  // 매물이 부족해 폴백한 경우에만 근사치로 ±3% 보정을 적용.
  const floorAdj = floorFallback ? { 저:-0.03, 중:0, 고:0.03 }[floor] : 0;
  const estimate = base!==null ? Math.round(base*(1+floorAdj)*100)/100 : null;
  const rangeLow = estimate!==null ? Math.round(estimate*0.95*100)/100 : null;
  const rangeHigh = estimate!==null ? Math.round(estimate*1.05*100)/100 : null;

  const complexOptions = complexList.map(c=>`<option value="${c}" ${c===complex?'selected':''}>${c}</option>`).join('');
  const floorOptions = ['저','중','고'].map(f=>`<option value="${f}" ${f===floor?'selected':''}>${f}층</option>`).join('');
  const buildingSelectOptions = ["전체", ...buildingOptions].map(b=>`<option value="${b}" ${b===building?'selected':''}>${b==='전체'?'전체(동 무관)':b+'동'}</option>`).join('');
  const typeSelectOptions = ["전체", ...typeOptions].map(t=>`<option value="${t}" ${t===unitType?'selected':''}>${t==='전체'?'전체(타입 무관)':t}</option>`).join('');
  const directionSelectOptions = ["전체", ...directionOptions].map(d=>`<option value="${d}" ${d===direction?'selected':''}>${d==='전체'?'전체(향 무관)':d}</option>`).join('');

  const nearbyTx = (REAL_TX[state.housingType]?.[complex] || []).filter(t=> Math.abs(t.size - area) <= 5)
    .sort((a,b)=> b.date.localeCompare(a.date)).slice(0,3);
  const nearbyTxHtml = nearbyTx.length ? `
    <div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px;">
      <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:6px;">최근 실거래 (${areaKey}㎡ 근처 · 사이즈별 정확 비교)</div>
      ${nearbyTx.map(t=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;">
        <span style="color:var(--text-muted);">${t.date} · ${t.dong!=='-'?t.dong+'동 ':''}${t.floor}층 · ${Math.floor(t.size)}㎡</span>
        <span style="font-weight:700;">${t.amount}억 ${t.isRecordHigh?'<span class="tag-gap" style="background:rgba(203,163,92,0.2);color:var(--gold);">신고가</span>':''}</span>
      </div>`).join('')}
      <div style="font-size:10.5px;color:var(--text-muted);margin-top:4px;">※ 신고가는 같은 정확한 전용면적끼리만 비교한 기록입니다. 사이즈가 다르면 서로 다른 타입의 신고가라 동시에 여러 건 뜰 수 있어요.</div>
    </div>` : '';

  const resultHtml = estimate!==null ? `
    <div class="panel" style="border-color:var(--teal-light);">
      <h2>추정 시세</h2>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:32px;font-weight:600;color:var(--gold);">${estimate}억</div>
      <div style="color:var(--text-muted);font-size:13px;margin-top:4px;">추정 범위 ${rangeLow}억 ~ ${rangeHigh}억 (±5%)</div>
      ${listingMatches.length>0 && listingMatches.length<MIN_SAMPLE ? `<div style="margin-top:8px;font-size:12px;color:var(--gold);background:rgba(203,163,92,0.12);border:1px solid rgba(203,163,92,0.3);border-radius:6px;padding:6px 10px;">⚠️ 매물 표본이 적어 참고용으로만 봐주세요.</div>` : ''}
      <div style="color:var(--text-muted);font-size:12px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px;">${simpleBasis}</div>
      ${nearbyTxHtml}
      <button id="sharePredictBtn" class="share-btn" onclick="copyShareLink('sharePredictBtn')">🔗 이 결과 URL 공유</button>
    </div>` : `
    <div class="panel"><div class="empty-state"><div class="icon">◧</div><div style="font-weight:600;">추정할 데이터가 부족합니다</div><div style="font-size:12px;">${complex}의 ${areaKey}㎡ 실거래·매물 데이터가 없습니다. 다른 평형을 시도해보세요.</div></div></div>`;

  return `<div class="panel">
      <h2>내집시세예측 · ${scopeLabel}</h2>
      <p style="color:var(--text-muted);font-size:13px;margin-top:-6px;margin-bottom:16px;">단지 · 전용면적 · 동 · 층 · 향을 선택하면 국토부 실거래가와 실제 매물 호가를 함께 반영해 추정가를 계산합니다.</p>
      <div style="display:flex;flex-direction:column;gap:12px;max-width:420px;">
        <div>
          <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:5px;">단지</div>
          <select onchange="setPredictComplex(this.value)" style="width:100%;padding:9px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:'Pretendard';font-size:13px;">${complexOptions}</select>
        </div>
        <div>
          <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:5px;">전용면적(㎡)${exactAreas.length ? ` — ${complex} 실제 평형만 표시` : ' (매물 데이터 없어 근사 선택)'}</div>
          ${exactAreas.length ? `
          <select onchange="setPredictArea(this.value)" style="width:100%;padding:9px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:'Pretendard';font-size:13px;">
            ${exactAreas.map(a=>{
              const hasListing = listingAreas.includes(a);
              return `<option value="${a}" ${a===area?'selected':''}>${a}㎡ (${areaBucketOf(a)})${hasListing?'':' · 매물없음, 실거래만'}</option>`;
            }).join('')}
          </select>` : `
          <input type="range" min="30" max="180" step="1" value="${area}" oninput="setPredictArea(this.value)" style="width:100%;">
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">현재 ${area}㎡ (${bucket}) — 이 단지는 리치부동산연구소 매물 데이터가 없어 정확한 평형을 알 수 없습니다.</div>`}
        </div>
        <div>
          <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:5px;">타입 (매물 데이터 기준)</div>
          <select onchange="setPredictType(this.value)" style="width:100%;padding:9px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:'Pretendard';font-size:13px;">${typeSelectOptions}</select>
          ${typeOptions.length===0 ? `<div style="font-size:11px;color:var(--text-muted);margin-top:4px;">이 단지·평형은 매물 데이터가 없어 타입 선택이 의미 없습니다.</div>` : ''}
        </div>
        <div>
          <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:5px;">동 (건물동, 매물 데이터 기준)</div>
          <select onchange="setPredictBuilding(this.value)" style="width:100%;padding:9px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:'Pretendard';font-size:13px;">${buildingSelectOptions}</select>
          ${buildingOptions.length===0 ? `<div style="font-size:11px;color:var(--text-muted);margin-top:4px;">이 단지·평형은 매물 데이터가 없어 동 선택이 의미 없습니다.</div>` : ''}
        </div>
        <div>
          <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:5px;">층</div>
          <select onchange="setPredictFloor(this.value)" style="width:100%;padding:9px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:'Pretendard';font-size:13px;">${floorOptions}</select>
        </div>
        <div>
          <div style="font-size:11.5px;color:var(--text-muted);margin-bottom:5px;">향 (매물 데이터 기준, 실거래엔 없음)</div>
          <select onchange="setPredictDirection(this.value)" style="width:100%;padding:9px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:'Pretendard';font-size:13px;">${directionSelectOptions}</select>
          ${directionOptions.length===0 ? `<div style="font-size:11px;color:var(--text-muted);margin-top:4px;">이 단지·평형·동은 매물 데이터가 없어 향 선택이 의미 없습니다.</div>` : ''}
        </div>
      </div>
    </div>
    ${resultHtml}
    <div class="panel" style="border-color:var(--teal-light);">
      <h2>우리집 시세 확인하셨나요?</h2>
      <p style="color:var(--text-muted);font-size:13px;margin-top:-6px;margin-bottom:12px;">지금 조회하신 조건으로 바로 매도 문의를 남기실 수 있어요.</p>
      <button class="form-submit-btn" style="margin-top:0;background:var(--teal-light);color:#06201D;" onclick="openInquiry('sell')">🏠 우리집 매물 내놓기</button>
      ${state.inquiry.open ? renderInquiryForm(complexList) : ''}
      <div class="cta-phone-alt">매수 문의는 <b>매물찾기</b> 탭에서 남길 수 있어요 · 급하신가요? 바로 전화: <a href="tel:010-4897-8240">010-4897-8240</a></div>
    </div>`;
}

function setPredictComplex(v){ state.predict.complex = v; state.predict.area = 84; state.predict.unitType = '전체'; state.predict.building = '전체'; state.predict.direction = '전체'; render(); }
function setPredictArea(v){ state.predict.area = Number(v); state.predict.unitType = '전체'; state.predict.building = '전체'; state.predict.direction = '전체'; render(); }
function setPredictType(v){ state.predict.unitType = v; state.predict.building = '전체'; state.predict.direction = '전체'; render(); }
function setPredictBuilding(v){ state.predict.building = v; state.predict.direction = '전체'; render(); }
function setPredictFloor(v){ state.predict.floor = v; render(); }
function setPredictDirection(v){ state.predict.direction = v; render(); }

function selectGu(gu){
  state.gu = gu; state.dong = "전체"; state.finder.complex = "전체"; state.finder.exactArea = "전체"; state.finder.searched = false;
  state.realprice.complex = "전체"; state.realprice.area = "전체";
  const cur = FEATURES.find(f=>f.key===state.feature);
  const has = HAS_LISTING[gu] && HAS_LISTING[gu][state.housingType];
  if(cur.needsListing && !has) state.feature = 'overview';
  render();
}
function selectDong(dong){ state.dong = dong; state.finder.complex = "전체"; state.finder.exactArea = "전체"; state.finder.searched = false; state.realprice.complex = "전체"; state.realprice.area = "전체"; render(); }
function selectType(t){
  state.housingType = t; state.finder.complex = "전체"; state.finder.exactArea = "전체"; state.finder.searched = false;
  state.realprice.complex = "전체"; state.realprice.area = "전체";
  const cur = FEATURES.find(f=>f.key===state.feature);
  const has = HAS_LISTING[state.gu] && HAS_LISTING[state.gu][t];
  if(cur.needsListing && !has) state.feature = 'overview';
  render();
}
function selectFeature(key){ state.feature = key; state.inquiry.open = false; state.inquiry.done = false; render(); }

/* ───────── URL 공유 링크 ───────── */
function buildShareParams(){
  const p = new URLSearchParams();
  p.set('gu', state.gu);
  p.set('dong', state.dong);
  p.set('type', state.housingType);
  p.set('feature', state.feature);
  if(state.feature==='finder'){
    p.set('budget', state.finder.budget);
    p.set('areaBucket', state.finder.areaBucket);
    p.set('exactArea', state.finder.exactArea);
    p.set('complex', state.finder.complex);
    p.set('gap', state.finder.gapOnly ? '1' : '0');
  } else if(state.feature==='predict'){
    p.set('pComplex', state.predict.complex || '');
    p.set('pArea', state.predict.area);
    p.set('pFloor', state.predict.floor);
    p.set('pBuilding', state.predict.building);
    p.set('pDirection', state.predict.direction);
  }
  return p;
}

function buildShareURL(){
  const url = new URL(window.location.href.split('?')[0].split('#')[0]);
  url.search = buildShareParams().toString();
  return url.toString();
}

function loadStateFromURL(){
  const p = new URLSearchParams(window.location.search);
  if(![...p.keys()].length) return;
  if(p.get('gu') && REAL[p.get('gu')]) state.gu = p.get('gu');
  if(p.get('dong')) state.dong = p.get('dong');
  if(p.get('type')) state.housingType = p.get('type');
  if(p.get('feature')) state.feature = p.get('feature');
  if(state.feature==='finder'){
    if(p.get('budget')) state.finder.budget = p.get('budget');
    if(p.get('areaBucket')) state.finder.areaBucket = p.get('areaBucket');
    if(p.get('exactArea')) state.finder.exactArea = p.get('exactArea');
    if(p.get('complex')) state.finder.complex = p.get('complex');
    if(p.get('gap')) state.finder.gapOnly = p.get('gap')==='1';
    const hasFilter = state.finder.budget!=='전체' || state.finder.areaBucket!=='전체' || state.finder.exactArea!=='전체' || state.finder.complex!=='전체' || state.finder.gapOnly;
    state.finder.searched = hasFilter;
  } else if(state.feature==='predict'){
    if(p.get('pComplex')) state.predict.complex = p.get('pComplex');
    if(p.get('pArea')) state.predict.area = Number(p.get('pArea'));
    if(p.get('pFloor')) state.predict.floor = p.get('pFloor');
    if(p.get('pBuilding')) state.predict.building = p.get('pBuilding');
    if(p.get('pDirection')) state.predict.direction = p.get('pDirection');
  }
}

function copyShareLink(btnId){
  const url = buildShareURL();
  const done = () => {
    const btn = document.getElementById(btnId);
    if(btn){
      const original = btn.dataset.label || btn.textContent;
      btn.dataset.label = original;
      btn.textContent = '✅ 링크가 복사되었습니다';
      setTimeout(()=>{ btn.textContent = original; }, 2000);
    }
    try { history.replaceState(null, '', url); } catch(e){}
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(()=>fallbackCopy(url, done));
  } else {
    fallbackCopy(url, done);
  }
}

function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
  if(cb) cb();
}

loadStateFromURL();
render();

// PWA 설치 지원: 서비스워커 등록 (file:// 로컬 열람 시에는 지원 안 되며, https 배포 후 정상 동작)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

/* ── 앱 설치 버튼 ──
   - 이미 홈화면에 설치되어 실행 중이면(standalone) 버튼을 아예 숨김
   - 안드로이드/크롬 등 beforeinstallprompt 지원 브라우저: 버튼 탭 시 네이티브 설치창 바로 띄움
   - iOS Safari(beforeinstallprompt 미지원): "공유 → 홈 화면에 추가" 안내 모달 표시
*/
let deferredInstallPrompt = null;

function isStandaloneMode(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}
function isMobile(){
  return /android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent) || ('ontouchstart' in window);
}
/* 카카오톡/네이버/인스타그램/페이스북/라인 등 인앱 브라우저는
   "홈 화면에 추가" 기능 자체가 없어서 별도 안내가 필요함 */
function isInAppBrowser(){
  const ua = navigator.userAgent || '';
  return /kakaotalk|naver|instagram|fban|fbav|line\//i.test(ua);
}

function renderInstallBanner(){
  const el = document.getElementById('installBanner');
  if(!el) return;
  if(isStandaloneMode()){ el.innerHTML = ''; return; }
  if(isInAppBrowser()){
    // 인앱 브라우저는 애초에 설치가 불가능 — 외부 브라우저로 열도록 안내
    el.innerHTML = `<button class="install-banner" onclick="showInstallGuide('inapp')">📲 앱 설치하기 — 바탕화면에 바로 추가</button>`;
  } else if(deferredInstallPrompt){
    // 크롬 등 네이티브 설치 프롬프트 지원 브라우저 — 탭하면 바로 설치창
    el.innerHTML = `<button class="install-banner" onclick="triggerInstall()">📲 앱 설치하기 — 바탕화면에 바로 추가</button>`;
  } else if(isIOS()){
    el.innerHTML = `<button class="install-banner" onclick="showInstallGuide('ios')">📲 앱 설치하기 — 바탕화면에 바로 추가</button>`;
  } else if(isMobile()){
    // 삼성인터넷 등 beforeinstallprompt 미지원/미발생 브라우저 — 수동 안내로 대체
    el.innerHTML = `<button class="install-banner" onclick="showInstallGuide('android')">📲 앱 설치하기 — 바탕화면에 바로 추가</button>`;
  } else {
    el.innerHTML = '';
  }
}

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  renderInstallBanner();
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  renderInstallBanner();
});

async function triggerInstall(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  renderInstallBanner();
}

function showInstallGuide(kind){
  const el = document.getElementById('iosInstallModal');
  el.style.display = 'block';
  let title = '📲 홈 화면에 앱 추가하기';
  let steps;
  if(kind === 'inapp'){
    title = '⚠️ 이 브라우저에서는 설치가 안 돼요';
    steps = `
        <li>카카오톡 등 앱 안에 열린 브라우저는 "홈 화면에 추가" 기능이 없습니다</li>
        <li>우측 상단 <b>메뉴(⋮ 또는 ···)</b> 버튼을 탭하세요</li>
        <li><b>"다른 브라우저로 열기"</b>를 선택해 크롬(또는 삼성인터넷)으로 여세요</li>
        <li>그 브라우저에서 다시 <b>"앱 설치하기"</b> 버튼을 눌러주세요</li>`;
  } else if(kind === 'ios'){
    steps = `
        <li>하단(또는 상단)의 <b>공유</b> 버튼을 탭하세요</li>
        <li>메뉴에서 <b>"홈 화면에 추가"</b>를 선택하세요</li>
        <li><b>"추가"</b>를 누르면 바탕화면에 앱처럼 설치됩니다</li>`;
  } else {
    steps = `
        <li>우측 상단 <b>메뉴(⋮)</b> 버튼을 탭하세요</li>
        <li><b>"홈 화면에 추가"</b> 또는 <b>"앱 설치"</b>를 선택하세요</li>
        <li>확인을 누르면 바탕화면에 앱처럼 설치됩니다</li>`;
  }
  el.innerHTML = `
    <div class="install-modal-overlay" onclick="if(event.target===this) closeIOSInstallGuide()">
      <div class="install-modal">
        <h3>${title}</h3>
        <ol>${steps}</ol>
        <button class="close-btn" onclick="closeIOSInstallGuide()">확인했습니다</button>
      </div>
    </div>`;
}
function closeIOSInstallGuide(){
  const el = document.getElementById('iosInstallModal');
  el.style.display = 'none';
  el.innerHTML = '';
}

/* 지금 보고 있는 화면을 그대로 깔끔한 레포트로 인쇄(또는 PDF로 저장) */
function printReport(){
  const featureLabel = (FEATURES.find(f=>f.key===state.feature) || {}).label || '';
  const scopeParts = [state.gu];
  if(state.dong !== '전체') scopeParts.push(state.dong);
  scopeParts.push(state.housingType);
  const now = new Date();
  const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} 기준`;
  const printHeaderEl = document.getElementById('printHeader');
  if(printHeaderEl){
    printHeaderEl.innerHTML = `
      <div class="title">리치아파트 · ${featureLabel} 레포트</div>
      <div>${scopeParts.join(' · ')} &nbsp;|&nbsp; 출력일시: ${dateStr} &nbsp;|&nbsp; 리치부동산연구소 (내부검토용 · 미공개)</div>
    `;
  }
  try{
    window.print();
  }catch(err){
    console.error('인쇄 호출 실패:', err);
    alert('이 화면(미리보기)에서는 인쇄가 지원되지 않을 수 있습니다.\n실제 배포된 주소(예: https://richfather-reality.github.io/...)로 접속해서 다시 시도해주세요.');
  }
}

renderInstallBanner();

</script>
